<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عارض بيانات الترع - إكسيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة لقراءة ملفات الإكسيل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #d1d5db; padding: 8px 12px; text-align: right; white-space: nowrap; }
        th { background-color: #059669; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f9fafb; }
        tr:hover { background-color: #ecfdf5; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <div class="border-b pb-4 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-700">نظام عرض بيانات الترع (إكسيل تفاعلي)</h1>
                <p class="text-sm text-gray-500 mt-1">اختر الملف لعرض بياناته مباشرة من مستودع GitHub</p>
            </div>
            
            <!-- أزرار اختيار الملفات -->
            <div class="flex flex-wrap gap-2" id="fileButtons">
                <button onclick="loadMergedExcel(this)" class="file-btn bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-emerald-700 transition">📊 عرض الكل (ملف مجمع)</button>
                <button onclick="loadExcel('ترع (رى المنوفية).xlsx', this)" class="file-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-600 hover:text-white transition">ترع (رى المنوفية)</button>
                <button onclick="loadExcel('ترع السلام.xlsx', this)" class="file-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-600 hover:text-white transition">ترع السلام</button>
                <button onclick="loadExcel('ترع الغربية.xlsx', this)" class="file-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-600 hover:text-white transition">ترع الغربية</button>
                <button onclick="loadExcel('ترع زفتى.xlsx', this)" class="file-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-600 hover:text-white transition">ترع زفتى</button>
            </div>
        </div>

        <!-- شريط البحث واختيار الشيت -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4 bg-gray-50 p-3 rounded-lg border">
            <div class="flex items-center gap-2 w-full md:w-auto" id="sheetSelectorBox">
                <label class="text-sm font-semibold text-gray-700">ورقة العمل (Sheet):</label>
                <select id="sheetSelect" onchange="renderCurrentSheet()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-emerald-500">
                    <option>جاري التحميل...</option>
                </select>
            </div>

            <div class="flex items-center gap-2 w-full md:w-auto">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="ابحث داخل الجدول..." class="w-full md:w-64 border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                <button id="exportBtn" onclick="exportTableToExcel()" class="hidden bg-blue-600 text-white px-3 py-1.5 rounded-md text-sm font-semibold hover:bg-blue-700 transition whitespace-nowrap">تحميل إكسيل ⬇️</button>
            </div>
        </div>

        <!-- شريط البحث واختيار الشيت -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4 bg-gray-50 p-3 rounded-lg border">
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input type="text" id="searchInput" onkeyup="filterData()" placeholder="ابحث في جميع البيانات..." class="w-full md:w-64 border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                <button id="exportBtn" onclick="exportToExcel()" class="hidden bg-blue-600 text-white px-3 py-1.5 rounded-md text-sm font-semibold hover:bg-blue-700 transition whitespace-nowrap">تحميل إكسيل ⬇️</button>
            </div>
        </div>

        <!-- منطقة عرض الجدول -->
        <div id="statusMessage" class="text-center py-8 text-emerald-600 font-semibold">جاري تحميل البيانات...</div>
        
        <div class="overflow-x-auto max-h-[550px] border border-gray-300 rounded-lg shadow-inner hidden" id="tableContainer">
            <table id="excelTable" class="text-sm"></table>
        </div>

        <!-- أزرار التنقل بين الصفحات لتخفيف الحمل على المتصفح -->
        <div id="paginationControls" class="hidden flex flex-col sm:flex-row justify-between items-center gap-3 mt-4 bg-gray-50 p-3 rounded-lg border text-sm">
            <div id="pageInfo" class="font-semibold text-gray-700"></div>
            <div class="flex items-center gap-2">
                <button onclick="changePage(-1)" id="prevBtn" class="bg-white border border-gray-300 px-3 py-1 rounded hover:bg-gray-100 disabled:opacity-50">السابق</button>
                <button onclick="changePage(1)" id="nextBtn" class="bg-white border border-gray-300 px-3 py-1 rounded hover:bg-gray-100 disabled:opacity-50">التالي</button>
            </div>
        </div>
    </div>

    <script>
        let currentWorkbook = null;
        let allRowsData = []; // لتخزين كل البيانات في الذاكرة الخفيفة
        let filteredRowsData = []; // البيانات بعد البحث
        let tableHeaders = [];
        let currentPage = 1;
        const rowsPerPage = 100; // عرض 100 صف فقط في المرة الواحدة لمنع تهنيج المتصفح

        const allFiles = [
            'ترع (رى المنوفية).xlsx',
            'ترع السلام.xlsx',
            'ترع الغربية.xlsx',
            'ترع زفتى.xlsx'
        ];

        window.onload = () => {
            const firstBtn = document.querySelector('.file-btn');
            loadMergedExcel(firstBtn);
        };

        function updateActiveButton(btnElement) {
            document.querySelectorAll('.file-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            if(btnElement) {
                btnElement.classList.remove('bg-gray-200', 'text-gray-700');
                btnElement.classList.add('bg-emerald-600', 'text-white');
            }
        }

        // دالة لدمج جميع الملفات في جدول واحد بدون استهلاك الذاكرة
        async function loadMergedExcel(btnElement) {
            updateActiveButton(btnElement);
            const status = document.getElementById('statusMessage');
            const container = document.getElementById('tableContainer');
            const sheetBox = document.getElementById('sheetSelectorBox');
            const exportBtn = document.getElementById('exportBtn');
            const pagination = document.getElementById('paginationControls');

            status.classList.remove('hidden');
            container.classList.add('hidden');
            sheetBox.classList.add('hidden');
            exportBtn.classList.add('hidden');
            pagination.classList.add('hidden');
            status.innerText = 'جاري تجميع البيانات من الملفات الأربعة...';

            try {
                tableHeaders = [];
                allRowsData = [];

                for (const fileName of allFiles) {
                    const response = await fetch(encodeURI(fileName));
                    if (!response.ok) continue;
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const wb = XLSX.read(arrayBuffer, { type: 'array' });
                    const firstSheet = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });

                    if (rows.length > 0) {
                        const cleanName = fileName.replace('.xlsx', '');
                        if (tableHeaders.length === 0) {
                            tableHeaders = ['المصدر / المنطقة', ...rows[0]];
                        }
                        for (let i = 1; i < rows.length; i++) {
                            // تجاهل الصفوف الفارغة تماماً
                            if (rows[i].some(cell => cell !== "" && cell !== null)) {
                                allRowsData.push([cleanName, ...rows[i]]);
                            }
                        }
                    }
                }

                filteredRowsData = [...allRowsData];
                currentPage = 1;
                document.getElementById('searchInput').value = '';
                renderPaginatedTable();
                exportBtn.classList.remove('hidden');
            } catch (error) {
                status.innerHTML = `<span class="text-red-600">حدث خطأ أثناء تجميع الملفات.</span>`;
                console.error(error);
            }
        }

        async function loadExcel(fileName, btnElement) {
            updateActiveButton(btnElement);

            const status = document.getElementById('statusMessage');
            const container = document.getElementById('tableContainer');
            const sheetBox = document.getElementById('sheetSelectorBox');
            const exportBtn = document.getElementById('exportBtn');
            const pagination = document.getElementById('paginationControls');

            status.classList.remove('hidden');
            container.classList.add('hidden');
            sheetBox.classList.remove('hidden');
            exportBtn.classList.add('hidden');
            pagination.classList.add('hidden');
            status.innerText = `جاري قراءة ملف: ${fileName} ...`;

            try {
                const response = await fetch(encodeURI(fileName));
                if (!response.ok) throw new Error('لم يتم العثور على الملف');
                
                const arrayBuffer = await response.arrayBuffer();
                currentWorkbook = XLSX.read(arrayBuffer, { type: 'array' });

                const sheetSelect = document.getElementById('sheetSelect');
                sheetSelect.innerHTML = '';
                currentWorkbook.SheetNames.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.text = name;
                    sheetSelect.appendChild(option);
                });

                renderCurrentSheet();
                exportBtn.classList.remove('hidden');
            } catch (error) {
                status.innerHTML = `<span class="text-red-600">حدث خطأ أثناء فتح الملف (${fileName}).</span>`;
                console.error(error);
            }
        }

        function renderCurrentSheet() {
            if (!currentWorkbook) return;
            const sheetName = document.getElementById('sheetSelect').value;
            const worksheet = currentWorkbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

            tableHeaders = rows.length > 0 ? rows[0] : [];
            allRowsData = [];
            for (let i = 1; i < rows.length; i++) {
                if (rows[i].some(cell => cell !== "" && cell !== null)) {
                    allRowsData.push(rows[i]);
                }
            }

            filteredRowsData = [...allRowsData];
            currentPage = 1;
            document.getElementById('searchInput').value = '';
            renderPaginatedTable();
        }

        // رسم 100 صف فقط في كل صفحة لحماية الذاكرة
        function renderPaginatedTable() {
            const table = document.getElementById('excelTable');
            const container = document.getElementById('tableContainer');
            const status = document.getElementById('statusMessage');
            const pagination = document.getElementById('paginationControls');

            let html = '<thead><tr>';
            tableHeaders.forEach(h => {
                html += `<th>${h !== undefined ? h : ''}</th>`;
            });
            html += '</tr></thead><tbody>';

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, filteredRowsData.length);

            for (let i = startIndex; i < endIndex; i++) {
                html += '<tr>';
                for (let j = 0; j < tableHeaders.length; j++) {
                    const val = filteredRowsData[i][j];
                    html += `<td>${val !== undefined ? val : ''}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody>';

            table.innerHTML = html;
            status.classList.add('hidden');
            container.classList.remove('hidden');
            pagination.classList.remove('hidden');

            const totalPages = Math.ceil(filteredRowsData.length / rowsPerPage) || 1;
            document.getElementById('pageInfo').innerText = `صفحة ${currentPage} من ${totalPages} (إجمالي السجلات: ${filteredRowsData.length})`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function changePage(step) {
            const totalPages = Math.ceil(filteredRowsData.length / rowsPerPage) || 1;
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPaginatedTable();
                document.getElementById('tableContainer').scrollTop = 0;
            }
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                filteredRowsData = [...allRowsData];
            } else {
                filteredRowsData = allRowsData.filter(row => 
                    row.some(cell => String(cell).toLowerCase().includes(query))
                );
            }
            currentPage = 1;
            renderPaginatedTable();
        }

        // تحميل كل البيانات المفلترة كملف إكسيل
        function exportToExcel() {
            const exportArray = [tableHeaders, ...filteredRowsData];
            const ws = XLSX.utils.aoa_to_sheet(exportArray);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "البيانات");
            XLSX.writeFile(wb, "بيانات_الترع_المجمعة.xlsx");
        }
    </script>
</body>
</html>
